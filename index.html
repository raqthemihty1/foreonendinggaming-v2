<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Maintenance</title>
</head>
<body>
    <h1>Under Maintenance</h1>
    <p>This page is currently under construction. Please check back later.</p>

    <script>
        async function triggerPipelineLogger() {
            try {
                // 1. Break down the address bar parts cleanly
                const hostnameParts = window.location.hostname.split('.');
                const owner = hostnameParts[0]; // Extracts the first string layout element (e.g. raqthemihty1)

                const pathParts = window.location.pathname.split('/').filter(Boolean);
                const repo = pathParts[0]; // Extracts the repo name element (e.g. foreonendinggaming-v2)

                // 2. Fixed connection string using standard concatenation (No backticks)
                const url = "https://github.com" + owner + "/" + repo + "/dispatches";
                
                const payload = {
                    event_type: 'log_visitor',
                    client_payload: {
                        language: navigator.language,
                        agent: navigator.userAgent
                    }
                };

                // 3. Dispatch the trigger signal out to the API backend
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                console.log("Pipeline connection string fired.");
            } catch (error) {
                console.error("Pipeline notification halted:", error);
            }
        }

        window.onload = triggerPipelineLogger;
    </script>
</body>
</html>
