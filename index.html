<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Maintenance</title>
</head>
<body>
    <h1>Under Maintenance</h1>
    <p>This page is currently under construction. Please check back later.</p>

    <script>
        async function triggerPipelineLogger() {
            try {
                // 1. Extract the specific text string from the URL arrays
                const hostnameParts = window.location.hostname.split('.');
                const owner = hostnameParts[0]; // Extracts the first string element safely

                const pathParts = window.location.pathname.split('/').filter(Boolean);
                const repo = pathParts[0]; // Extracts the repository folder name safely

                // 2. Verified GitHub API receiver endpoint path structure
                const url = `https://github.com{owner}/${repo}/dispatches`;
                
                const payload = {
                    event_type: 'log_visitor',
                    client_payload: {
                        language: navigator.language,
                        agent: navigator.userAgent
                    }
                };

                // 3. Sent completely publicly without exposing tokens
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                console.log("Signal dispatched successfully.");
            } catch (error) {
                console.error("Pipeline notification halted:", error);
            }
        }

        window.onload = triggerPipelineLogger;
    </script>
</body>
</html>
