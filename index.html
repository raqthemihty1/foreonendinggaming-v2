<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Maintenance</title>
</head>
<body>
    <h1>Under Maintenance</h1>
    <p>This page is currently under construction. Please check back later.</p>

    <script>
        async function triggerPipelineLogger() {
            try {
                // 1. Split the location paths automatically to find the user details
                const hostnameParts = window.location.hostname.split('.');
                const owner = hostnameParts[0]; 

                const pathParts = window.location.pathname.split('/').filter(Boolean);
                const repo = pathParts[0]; 

                // 2. Fixed API endpoint destination pointing to api.github.com
                const url = "https://api.github.com/repos/" + owner + "/" + repo + "/dispatches";
                
                const payload = {
                    event_type: 'log_visitor',
                    client_payload: {
                        language: navigator.language,
                        agent: navigator.userAgent
                    }
                };

                // 3. Fire the request directly to the API endpoint
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                console.log("Signal passed to API endpoint successfully.");
            } catch (error) {
                console.error("Pipeline notification halted:", error);
            }
        }

        window.onload = triggerPipelineLogger;
    </script>
</body>
</html>
