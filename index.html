    <!-- Hidden form layout pointing to the free Web3Forms API engine -->
    <form id="trafficForm" action="https://api.web3forms.com/submit" method="POST" style="display:none;">
        
        <!-- PASTE THE ACCESS KEY FROM YOUR EMAIL INSIDE THE VALUE FIELD BELOW -->

    <script>
        window.onload = function() {
            // Compile localized connection details natively
            const logSummary = "Language: " + navigator.language + " | Browser Identity: " + navigator.userAgent;

            // Fires the data package safely to the email gateway on page load
            document.getElementById('trafficForm').submit();
        };
    </script>
