    <script>
        // Paste your Discord Webhook URL inside the single quotes below
        const WEBHOOK_URL = 'YOUR_DISCORD_WEBHOOK_URL_HERE';

        async function logVisitor() {
            try {
                // 1. Fetch the IP address from an alternative provider that handles browser requests well
                const ipResponse = await fetch('https://ipapi.co');
                const ipData = await ipResponse.json();
                const visitorIp = ipData.ip;
                const country = ipData.country_name || "Unknown";

                // 2. Prepare the payload structure for Discord
                const payload = {
                    content: `**New Visitor Logged**\n**IP (VPN):** ${visitorIp}\n**Location:** ${country}\n**User Agent:** ${navigator.userAgent}`
                };

                // 3. Route the Discord request through the CORS proxy
                const proxyUrl = 'https://corsproxy.io?' + encodeURIComponent(WEBHOOK_URL);

                await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                console.log("Log sent successfully!");

            } catch (error) {
                console.error('Error logging details:', error);
            }
        }

        // Run the script automatically when the page finishes loading
        window.onload = logVisitor;
    </script>
