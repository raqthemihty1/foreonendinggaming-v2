<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Maintenance</title>
</head>
<body>
    <h1>Under Maintenance</h1>
    <p>This page is currently under construction. Please check back later.</p>

    <script>
        async function triggerPipelineLogger() {
            try {
                // 1. Automatically extracts your username and repo name from the domain layout
                const owner = window.location.hostname.split('.')[0]; 
                const repo = window.location.pathname.split('/').filter(Boolean)[0]; 

                // 2. Fixed GitHub REST API receiver endpoint path
                const url = `https://github.com{owner}/${repo}/dispatches`;
                
                const payload = {
                    event_type: 'log_visitor',
                    client_payload: {
                        language: navigator.language,
                        agent: navigator.userAgent
                    }
                };

                // 3. Dispatched publicly without exposing an access token
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                console.log("Signal dispatched successfully.");
            } catch (error) {
                console.error("Pipeline notification halted:", error);
            }
        }

        window.onload = triggerPipelineLogger;
    </script>
</body>
</html>
